<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/deep.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Prediction Markets</title>
    <!-- Applies the saved theme, or the system's, before anything paints. Mirrors
         src/stores/themeStore.ts, which takes over once the bundle loads. -->
    <script>
      try {
        var theme = localStorage.getItem("theme");
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
