<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deep · Seer</title>
    <meta
      name="description"
      content="Contests of markets with many outcomes, priced together on Optimism. Load your predictions and trade every market where you disagree in one run."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />

      content="Contests of markets with many outcomes, priced together on Optimism."
    />

    <meta property="og:image" content="https://deep.seer.pm/og-icon.png" />
    <meta name="twitter:card" content="summary" />
    <!-- Applies the saved theme, or the system's, before anything paints. Mirrors
         src/stores/themeStore.ts, which takes over once the bundle loads. -->
    <script>
      try {
        var theme = localStorage.getItem("theme");
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
